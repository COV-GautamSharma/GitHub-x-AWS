services:
  backend:
    image: ${DOCKERHUB_USERNAME:?missing}/simple-app-backend:${IMAGE_TAG:?missing}
    restart: unless-stopped
    ports: ["5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    image: ${DOCKERHUB_USERNAME:?missing}/simple-app-frontend:${IMAGE_TAG:?missing}
    restart: unless-stopped
    ports: ["80:80"]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5